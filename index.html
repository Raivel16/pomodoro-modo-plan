<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Temporizador Pomodoro con ciclos de trabajo y descanso.">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="work" data-state="idle">
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Pomodoro</h1>
    </header>

    <nav class="modes" aria-label="Modos del temporizador">
      <button type="button" class="modes__button" data-mode-button="work" aria-pressed="true">Work</button>
      <button type="button" class="modes__button" data-mode-button="break" aria-pressed="false">Short Break</button>
    </nav>

    <section class="timer" role="timer" aria-label="Tiempo restante del ciclo actual">
      <p class="timer__display" id="time-display">25:00</p>
      <div class="timer__progress" aria-hidden="true">
        <div class="timer__progress-bar" id="progress-bar"></div>
      </div>
    </section>

    <section class="controls" aria-label="Controles del temporizador">
      <button type="button" id="btn-toggle" class="controls__button controls__button--primary">Iniciar</button>
      <button type="button" id="btn-reset" class="controls__button">Reiniciar</button>
    </section>

    <section id="status-region" class="status" role="status" aria-live="polite"></section>
  </main>

  <footer class="app__footer">
    <p class="counter">Pomodoros completados: <span id="cycle-count">0</span></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
